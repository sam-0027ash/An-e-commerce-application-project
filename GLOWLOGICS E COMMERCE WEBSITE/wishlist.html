<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your Wishlist</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      body {
        background: rgb(106, 22, 5);
        background: -webkit-radial-gradient(center, rgb(238, 194, 37), #de190f);
        min-height: 100vh;
        color: #030031;
      }
      .navbar {
        background-color: black;
      }
      .navbar a {
        color: antiquewhite !important;
      }
      .dropdown-menu {
        background-color: #111;
        border: none;
      }
      .dropdown-item {
        color: white;
      }
      .dropdown-item:hover {
        background-color: #222;
        color: #fff;
      }
      .nav-icon {
        font-size: 1.1rem;
        margin-left: 15px;
        position: relative;
      }
      .search-box {
        width: 250px;
      }
      .cart-count {
        position: absolute;
        top: -7px;
        right: -9px;
        background: red;
        color: white;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 50%;
      }
      .btn-warning {
        transition: 0.3s;
      }

      .btn-warning:hover {
        background-color: #ff0000;
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }
      .card {
        height: 50%;
        display: flex;
        flex-direction: column;
      }

      .card-body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .card-title {
        min-height: 48px;
      }

      .card {
        border-radius: 15px;
        overflow: hidden;
      }

      .card img {
        height: 150px;
        padding: 10px;
        object-fit: contain;
      }

      .card:hover {
        transform: translateY(-8px);
        transition: 0.3s;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      @media (max-width: 576px) {
        .search-box {
          width: 100%;
          margin-top: 10px;
        }

        .navbar .d-flex.align-items-center {
          margin-top: 10px;
        }

        h2 {
          font-size: 1.4rem;
        }

        .card img {
          height: 120px;
        }
      }

      @media (min-width: 577px) and (max-width: 992px) {
        .search-box {
          width: 180px;
        }

        .card img {
          height: 140px;
        }
      }

      @media (min-width: 1200px) {
        .card img {
          height: 160px;
        }
      }

      @media (max-width: 768px) {
        .navbar-collapse {
          text-align: center;
        }

        .nav-icon {
          margin: 10px;
        }
      }
    </style>
  </head>

  <body class="bg-light">
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-lg"
    >
      <div class="container-fluid">
        <a href="./index.html" class="navbar-brand fw-bold">Hearth & Hue</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="./index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./ecommerce.html">Shop</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                >Categories</a
              >
              <ul class="dropdown-menu">
                <li>
                  <a
                    href="ecommerce.html?category=Electronics"
                    class="dropdown-item"
                    onclick="filterProducts('Electronics')"
                    >Electronics</a
                  >
                </li>
                <li>
                  <a
                    href="ecommerce.html?category=Clothing"
                    class="dropdown-item"
                    onclick="filterProducts('Clothing')"
                    >Clothing</a
                  >
                </li>
                <li>
                  <a
                    href="ecommerce.html?category=Accessories"
                    class="dropdown-item"
                    onclick="filterProducts('Accessories')"
                    >Accessories</a
                  >
                </li>
                <li>
                  <a
                    href="ecommerce.html?category=Home"
                    class="dropdown-item"
                    onclick="filterProducts('Home')"
                    >Home & Living</a
                  >
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link text-warning fw-bold" href="ecommerce.html?filter=deals">Deals</a>
            </li>
          </ul>
          <form class="d-flex me-3">
            <input
              class="form-control search-box"
              type="search"
              placeholder="Search products..."
              onkeyup="searchProducts(this.value)"
            />
          </form>
          <div class="d-flex align-items-center">
            <a href="./wishlist.html" class="nav-icon"
              ><i class="fa-regular fa-heart"></i
            ></a>
            <a href="./cart.html" class="nav-icon">
              <i class="fa-solid fa-cart-arrow-down"></i>
              <span class="cart-count">0</span>
            </a>
            <a href="#" class="nav-icon">
              <i class="fa-regular fa-circle-user"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <h2 class="text-center mb-4">
        <span style="color: #8b0000; font-size: 1.3em">❤️</span> Your Wishlist
      </h2>

      <div class="row g-4 mt-3" id="wishlist-container"></div>
    </div>
    <script>
      let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

      function loadWishlist() {
        let container = document.getElementById("wishlist-container");
        container.innerHTML = "";

        if (wishlist.length === 0) {
          container.innerHTML =
            "<h5 class='text-center'>Your wishlist is empty</h5>";
          return;
        }

        wishlist.forEach((item) => {
          container.innerHTML += `
      <div class="col-xl-2 col-lg-3 col-md-4 col-sm-6 col-12">
        <div class="card h-100 shadow-sm border-0">
          <img src="${item.img}" class="card-img-top">
          <div class="card-body text-center d-flex flex-column">
          <h6 class="card-title">${item.name}</h6>
          <p class="text-muted">${item.price}</p>
            <div class="mt-auto">
            <button class="btn btn-warning w-100 fw-semibold rounded-pill">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    `;
        });
      }

      document.addEventListener("DOMContentLoaded", loadWishlist);
    </script>
  </body>
</html>
