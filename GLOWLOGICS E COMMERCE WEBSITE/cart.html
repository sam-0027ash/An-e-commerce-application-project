<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Your Cart</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      body {
        background: rgb(106, 22, 5);
        background: -webkit-radial-gradient(center, rgb(238, 194, 37), #de190f);
        min-height: 100vh;
        color: #030031;
      }
      .navbar {
        background-color: black;
      }
      .navbar a {
        color: antiquewhite !important;
      }
      .dropdown-menu {
        background-color: #111;
        border: none;
      }
      .dropdown-item {
        color: white;
      }
      .dropdown-item:hover {
        background-color: #222;
        color: #fff;
      }
      .nav-icon {
        font-size: 1.1rem;
        margin-left: 15px;
        position: relative;
      }
      .search-box {
        width: 250px;
      }
      .cart-count {
        position: absolute;
        top: -7px;
        right: -9px;
        background: red;
        color: white;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 50%;
      }
      .btn-warning {
        transition: 0.3s;
      }

      .btn-warning:hover {
        background-color: #ff0000;
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }
      .mega-deal {
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .mega-deal:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 0 20px rgba(255, 193, 7, 0.6);
        background-color: #1a1a1a;
      }

      @media (max-width: 576px) {
        .btn-sm {
          width: 100%;
          margin-bottom: 5px;
        }
      }
      .card {
        border-radius: 12px;
      }

      @media (max-width: 576px) {
        .card {
          padding: 10px;
        }
      }
      @media (max-width: 768px) {
        .search-box {
          width: 100%;
          margin-top: 10px;
        }
      }

      @media (max-width: 576px) {
        .nav-icon {
          margin-left: 10px;
        }
      }
      #cart-items .card {
        transition: 0.3s;
      }

      #cart-items .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>

  <body class="bg-light">
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-lg"
    >
      <div class="container-fluid">
        <a href="./index.html" class="navbar-brand fw-bold">Hearth & Hue</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="./index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./ecommerce.html">Shop</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                >Categories</a
              >
              <ul class="dropdown-menu">
                <li>
                  <a
                    href="ecommerce.html?category=Electronics"
                    class="dropdown-item"
                    onclick="filterProducts('Electronics')"
                    >Electronics</a
                  >
                </li>
                <li>
                  <a
                    href="ecommerce.html?category=Clothing"
                    class="dropdown-item"
                    onclick="filterProducts('Clothing')"
                    >Clothing</a
                  >
                </li>
                <li>
                  <a
                    href="ecommerce.html?category=Accessories"
                    class="dropdown-item"
                    onclick="filterProducts('Accessories')"
                    >Accessories</a
                  >
                </li>
                <li>
                  <a
                    href="ecommerce.html?category=Home"
                    class="dropdown-item"
                    onclick="filterProducts('Home')"
                    >Home & Living</a
                  >
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link text-warning fw-bold" href="ecommerce.html?filter=deals">Deals</a>
            </li>
          </ul>
          <form class="d-flex me-3">
            <input
              class="form-control search-box"
              type="search"
              placeholder="Search products..."
              onkeyup="searchProducts(this.value)"
            />
          </form>
          <div class="d-flex align-items-center">
            <a href="./wishlist.html" class="nav-icon"
              ><i class="fa-regular fa-heart"></i
            ></a>
            <a href="./cart.html" class="nav-icon">
              <i class="fa-solid fa-cart-arrow-down"></i>
              <span class="cart-count">0</span>
            </a>
            <a href="#" class="nav-icon">
              <i class="fa-regular fa-circle-user"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
    <div class="container mt-4 mt-md-5 px-3">
      <h2 class="mb-3 text-center text-md-start">🛒 Your Cart</h2>

      <div id="cart-items"></div>

      <h4 class="mt-4 text-center text-md-end">
        Total: ₹<span id="total-price">0</span>
      </h4>
    </div>

    <script>
      let cart = JSON.parse(localStorage.getItem("cart")) || [];

      function renderCart() {
        let container = document.getElementById("cart-items");
        let total = 0;

        container.innerHTML = "";

        cart.forEach((item) => {
          let priceNum = parseInt(item.price.replace(/[₹,]/g, ""));
          total += priceNum * item.quantity;

          container.innerHTML += `
      <div class="card mb-3 p-3">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center">
          
          <div>
            <h5>${item.name}</h5>
            <p>₹${priceNum} x ${item.quantity}</p>
          </div>

          <div class="mt-3 mt-md-0">
            <button class="btn btn-success btn-sm" onclick="changeQty('${item.id}', 1)">+</button>
            <button class="btn btn-warning btn-sm" onclick="changeQty('${item.id}', -1)">-</button>
            <button class="btn btn-danger btn-sm" onclick="removeItem('${item.id}')">Remove</button>
          </div>

        </div>
      </div>
    `;
        });

        document.getElementById("total-price").innerText = total;
      }

      function changeQty(id, change) {
        let item = cart.find((i) => i.id === id);
        item.quantity += change;

        if (item.quantity <= 0) {
          cart = cart.filter((i) => i.id !== id);
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      function removeItem(id) {
        cart = cart.filter((i) => i.id !== id);
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      renderCart();

      function updateCartCount() {
        // 🔥 refresh cart every time
        cart = JSON.parse(localStorage.getItem("cart")) || [];

        let total = cart.reduce((sum, item) => sum + item.quantity, 0);

        let countEl = document.querySelector(".cart-count");
        if (countEl) {
          countEl.innerText = total;
        }
      }

      function loadData() {
        updateCartCount();
      }

      document.addEventListener("DOMContentLoaded", loadData);
      window.addEventListener("storage", updateCartCount);
    </script>
  </body>
</html>
